[package]
name = "verdict"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Hunk-by-hunk review of AI-written code changes, fed back to the agent"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["code-review", "git", "diff", "ai", "claude"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
crossterm = { version = "0.29", features = ["use-dev-tty"], optional = true }
eframe = { optional = true, version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "clipboard"] }
fancy-regex = "0.20"
giallo = { version = "0.6.0", default-features = false, features = ["dump"] }
plist = "1.10.4"
# Already built by eframe; used to save scripted screenshots.
png = { version = "0.18", optional = true }
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm_0_29", "underline-color", "unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
toml = "1.2.3"
winit = { version = "0.30", default-features = false, features = ["x11"], optional = true }

[features]
default = ["gui", "tui"]
# The native egui window.
gui = ["dep:eframe", "dep:winit", "dep:png"]
# The terminal interface.
tui = ["dep:ratatui", "dep:crossterm"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4


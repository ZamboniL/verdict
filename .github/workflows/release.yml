name: Release

# Push a tag like v0.2.0 to build the binaries and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu so the binary runs on older glibc.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # The tag is the version: write it into Cargo.toml and Cargo.lock for this
      # build, so releasing doesn't need a version-bump commit.
      - name: Set the version from the tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME isn't v<semver>"
            exit 1
          fi
          perl -0pi -e 's/^version = "[^"]*"/version = "'"$version"'"/m' Cargo.toml
          perl -0pi -e 's/(name = "verdict"\nversion = )"[^"]*"/$1"'"$version"'"/' Cargo.lock
          grep -m1 '^version' Cargo.toml
          grep -A1 '^name = "verdict"$' Cargo.lock

      # rustup comes preinstalled on GitHub's runners.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="verdict-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/verdict" LICENSE README.md CONTRIBUTING.md "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}
          path: verdict-*.tar.gz*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "verdict $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

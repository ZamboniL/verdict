name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check
      # Code behind #[cfg(feature = ...)] is only linted when that feature is on.
      - name: Clippy (default features)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy (terminal only)
        run: cargo clippy --all-targets --locked --no-default-features --features tui -- -D warnings
      - name: Clippy (window only)
        run: cargo clippy --all-targets --locked --no-default-features --features gui -- -D warnings
      - name: Test
        run: cargo test --locked

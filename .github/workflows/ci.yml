name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # rustup comes preinstalled on GitHub's runners.
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3

      - name: Format
        run: cargo fmt --check
      # Code behind #[cfg(feature = ...)] is only linted when that feature is on.
      - name: Clippy (default features)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy (terminal only)
        run: cargo clippy --all-targets --locked --no-default-features --features tui -- -D warnings
      - name: Clippy (window only)
        run: cargo clippy --all-targets --locked --no-default-features --features gui -- -D warnings
      - name: Test
        run: cargo test --locked

  # Catches code that only compiles on Linux, like the X11 window backend.
  macos:
    name: clippy, test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  # Every action must have an entry in .github/workflows/actions.lock, pinned to a
  # commit that still matches its tag. Run `gh actions-lock` to update it.
  lockfile:
    name: actions lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.5.1
          gh actions-lock --verify
